name: Build

# The author works on Linux and has no Mac, so this workflow is the compiler.
# Every push gets built against the real iOS SDK here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          echo "--- SDKs ---"
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml
          echo "--- generated ---"
          ls -la Prism.xcodeproj

      # Optional. With no secrets set this no-ops and the unsigned .ipa is still
      # produced, which is what SideStore/AltStore want anyway — they re-sign
      # with your own Apple ID. Set all three secrets only if you have a
      # provisioning profile whose App ID matches PRODUCT_BUNDLE_IDENTIFIER;
      # a profile for a *different* bundle id cannot sign this app.
      #   IOS_DIST_CERT_P12_BASE64, IOS_DIST_PROFILE_BASE64, IOS_CERT_PASSWORD
      - name: Import signing certificate & profile (optional)
        env:
          P12_B64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          PROFILE_B64: ${{ secrets.IOS_DIST_PROFILE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${P12_B64:-}" ] || [ -z "${PROFILE_B64:-}" ]; then
            echo "No signing secrets — building unsigned. Sideload with SideStore or AltStore."
            echo "SIGN_AVAILABLE=0" >> "$GITHUB_ENV"
            exit 0
          fi

          CERT="$RUNNER_TEMP/dist.p12"
          PROFILE="$RUNNER_TEMP/dist.mobileprovision"
          printf '%s' "$P12_B64" | base64 --decode > "$CERT"
          printf '%s' "$PROFILE_B64" | base64 --decode > "$PROFILE"

          # A throwaway keychain, so nothing is left behind on the runner.
          KEYCHAIN="$RUNNER_TEMP/prism-signing.keychain-db"
          KPW="$(uuidgen)"
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          # No `-t cert`. A .p12 is a bundle of a certificate *and* its private
          # key, and asking for just the certificate type makes the import fail
          # with "Unable to decode the provided data" — which reads like a
          # corrupt file rather than a wrong flag. `-f pkcs12` is enough to say
          # what the file is; `-T` grants codesign access without a prompt.
          security import "$CERT" -P "$P12_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Prove the key actually landed, rather than discovering it three
          # steps later as an inscrutable codesign error.
          security find-identity -v -p codesigning "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)

          # Fail loudly on the most likely mistake: a profile for another app.
          WANT="$(grep -m1 'PRODUCT_BUNDLE_IDENTIFIER' project.yml | sed 's/.*: *//')"
          APPID="$(security cms -D -i "$PROFILE" | plutil -extract Entitlements.application-identifier raw -)"
          echo "profile app-id : $APPID"
          echo "project bundle : $WANT"
          case "$APPID" in
            *".$WANT"|*".*") echo "profile matches" ;;
            *) echo "::error::Profile is for $APPID but this app is $WANT. A profile with an explicit App ID can only sign that exact bundle id."; exit 1 ;;
          esac

          UUID="$(security cms -D -i "$PROFILE" | plutil -extract UUID raw -)"
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$PROFILE" "$dir/$UUID.mobileprovision"
          done
          echo "Installed provisioning profile $UUID"
          echo "SIGN_AVAILABLE=1" >> "$GITHUB_ENV"

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Prism.xcodeproj \
            -scheme Prism \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | xcbeautify --renderer github-actions || {
              echo "::error::Build failed"
              exit 1
            }

      - name: Package .ipa
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/Prism.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::No .app produced at $APP_PATH"
            find build -name "*.app" -maxdepth 6 || true
            exit 1
          fi
          # An .ipa is just a zip with the app inside Payload/.
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Prism.ipa Payload
          echo "--- built ---"
          ls -lh Prism.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Prism-unsigned-ipa
          path: Prism.ipa
          retention-days: 30
