name: Screenshots

# Boots a real iOS Simulator, runs the app, and captures PNGs.
# This is how the app gets reviewed at all — the author is on Linux and has no
# simulator locally.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      demo:
        description: "Use bundled fixture data instead of live YouTube"
        type: boolean
        default: true

concurrency:
  group: shots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Capture simulator screenshots
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate --spec project.yml

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project Prism.xcodeproj \
            -scheme Prism \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | xcbeautify --renderer github-actions

      # The simulator build is what browser-streaming services (Appetize,
      # BrowserStack, LambdaTest) want — they run a real Simulator in the cloud,
      # so they need the iphonesimulator slice, not the device .ipa. It's already
      # been built above; this just keeps it.
      - name: Stage simulator app
        run: |
          APP=$(find build/Build/Products -name "Prism.app" -maxdepth 3 | head -1)
          echo "staging $APP"
          rm -rf simulator && mkdir simulator
          cp -R "$APP" simulator/
          du -sh simulator/Prism.app

      # Uploaded as a directory rather than a zip we make ourselves. A
      # self-made zip becomes a zip inside GitHub's own artifact zip, and
      # `gh run download` refuses that with "would result in path traversal".
      # Letting the action do the zipping means the web download is already a
      # zip containing Prism.app at its root — exactly what Appetize wants —
      # and `gh run download` extracts it cleanly.
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: Prism-simulator-app
          path: simulator/
          retention-days: 30

      - name: Capture iPhone
        run: ./scripts/capture.sh "iPhone 16 Pro" shots

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
          retention-days: 30

      # Prism is a universal binary, so every layout decision it makes at iPad
      # width goes unreviewed unless something actually runs it there. The
      # phone pass would stay green with the rail broken.
      - name: Capture iPad
        run: ./scripts/capture.sh "iPad Pro 13-inch (M4)" shots-ipad

      - name: Upload iPad screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-ipad
          path: shots-ipad/
          retention-days: 30
