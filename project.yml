# XcodeGen spec.
#
# The .xcodeproj is generated in CI rather than committed, because this project
# is authored on Linux where Xcode cannot open it. `xcodegen generate` on the
# macOS runner turns this file into a real project immediately before building.
name: Prism
options:
  bundleIdPrefix: com.prism
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_BITCODE: "NO"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  Prism:
    type: application
    platform: iOS
    sources:
      - path: Sources/Prism
      - path: Resources
        buildPhase: resources
        optional: true
    settings:
      base:
        # Matches the provisioning profile's App ID. Explicit App IDs sign
        # that one bundle id and nothing else, and this app isn't going to the
        # App Store, so the id is the profile's to choose rather than ours.
        PRODUCT_BUNDLE_IDENTIFIER: app.rhubarb5669.sagittarius5445
        PRODUCT_NAME: Prism
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # All four on iPad. Anything less makes iOS treat the app as
        # fullscreen-only, which costs Split View and Slide Over — the layouts
        # `PrismLayout` exists to handle.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        # 1 = iPhone, 2 = iPad. One binary, one bundle id, one signature — an
        # iPad build is not a separate app and does not need separate signing.
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Sources/Prism/Info.plist
      properties:
        CFBundleDisplayName: Prism
        # Required for the app to get the full screen. Without a UILaunchScreen
        # key iOS runs the app letterboxed in a compatibility-sized window.
        UILaunchScreen:
          UIColorName: ""
        # `audio` covers background playback *and* Picture in Picture — PiP is
        # refused outright without it, and audio stops the moment the app
        # leaves the foreground.
        UIBackgroundModes: [audio]
        # Registered at launch, before the first view renders. Static instances
        # cut from the Archivo variable font at wdth 125 / 112.
        UIAppFonts:
          - Archivo-Expanded.ttf
          - Archivo-SemiExpanded.ttf
        # googlevideo redirects across subdomains; AVFoundation needs the
        # latitude to follow those.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIViewControllerBasedStatusBarAppearance: false

  PrismTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/PrismTests
    dependencies:
      - target: Prism
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.rhubarb5669.sagittarius5445.tests
        GENERATE_INFOPLIST_FILE: "YES"
        # Tests run on the simulator and are never shipped.
        CODE_SIGNING_ALLOWED: "NO"

schemes:
  Prism:
    build:
      targets:
        Prism: all
        PrismTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PrismTests
    archive:
      config: Release
