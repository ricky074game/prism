# XcodeGen spec.
#
# The .xcodeproj is generated in CI rather than committed, because this project
# is authored on Linux where Xcode cannot open it. `xcodegen generate` on the
# macOS runner turns this file into a real project immediately before building.
name: Prism
options:
  bundleIdPrefix: com.prism
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_BITCODE: "NO"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  Prism:
    type: application
    platform: iOS
    sources:
      - path: Sources/Prism
      - path: Resources
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prism.client
        PRODUCT_NAME: Prism
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Sources/Prism/Info.plist
      properties:
        CFBundleDisplayName: Prism
        UIBackgroundModes: [audio]
        # Stream hosts are plain HTTPS, but googlevideo redirects across
        # subdomains; forward secrecy exceptions keep AVFoundation happy.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIViewControllerBasedStatusBarAppearance: false
